# PPO config for the AI Director (ML-Agents Release 23: com.unity.ml-agents 4.0.0 / mlagents 1.1.0).
# Tiny problem: 4 inputs, 3 actions, 3 decisions per episode -> small network, short training.
behaviors:
  Director:
    trainer_type: ppo
    hyperparameters:
      batch_size: 128
      buffer_size: 2048
      learning_rate: 3.0e-4
      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: false        # observations are already in [0, 1]
      hidden_units: 32
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.9
        strength: 1.0
    keep_checkpoints: 3
    checkpoint_interval: 25000
    max_steps: 100000
    time_horizon: 8
    summary_freq: 2000
engine_settings:
  time_scale: 20
  target_frame_rate: -1
torch_settings:
  device: cpu
