# PPO config for the AI Director (ML-Agents Release 23: com.unity.ml-agents 4.0.0 / mlagents 1.1.0).
# Episodes are one simulated run (5 segment decisions), so the horizon is short.
behaviors:
  Director:
    trainer_type: ppo
    hyperparameters:
      batch_size: 256
      buffer_size: 4096
      learning_rate: 3.0e-4
      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: false        # observations are already scaled to [0, 1]
      hidden_units: 64
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.9
        strength: 1.0
    keep_checkpoints: 5
    checkpoint_interval: 50000
    max_steps: 300000
    time_horizon: 16
    summary_freq: 5000
engine_settings:
  time_scale: 20
  target_frame_rate: -1
torch_settings:
  device: cpu
